# Two targets of a bakefile in one step. The bakefile names the stage of each
# target, `set` points their destinations at the test registry. The third
# target would fail to push, so the step also checks the selection. Later steps
# read each target's image from the `images` output.
name: test-bake

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# kaniko runs on the default bridge and reaches the registry service through
# its gateway, the runner reaches the same registry as localhost:5000.
env:
  REGISTRY: 172.17.0.1:5000

jobs:
  build:
    runs-on: ubuntu-26.04
    services:
      registry:
        image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7.0.1
      - id: bake
        uses: ./bake
        with:
          bakefile: tests/bake/kaniko-bake.hcl
          targets: app tools
          context: tests/bake
          set: |
            app.destination=${{ env.REGISTRY }}/test-bake-app:${{ github.sha }}
            tools.destination=${{ env.REGISTRY }}/test-bake-tools:${{ github.sha }}
      - name: verify
        env:
          IMAGES: ${{ steps.bake.outputs.images }}
          APP: ${{ fromJSON(steps.bake.outputs.images).app }}
          MERGE_IMAGE: registry.gitlab.com/osscontainertools/components/kaniko/merge:release-11b74ff77aae51e40166744b2c6e062c81633b84@sha256:322a2281f783d403be2b63ce88281f6ee54e9e08644d8f94628b5e23cdf6c4c8
        run: |
          test "$(echo "$IMAGES" | jq -c 'keys')" = '["app","tools"]'
          echo "$APP" | grep -E "^$REGISTRY/test-bake-app@sha256:[0-9a-f]{64}$"
          for target in app tools; do
            image=$(echo "$IMAGES" | jq -r --arg target "$target" '.[$target]')
            ref="localhost:5000/${image#*/}"
            test "$(docker run --rm --network host "$MERGE_IMAGE" crane digest "localhost:5000/test-bake-$target:$GITHUB_SHA")" = "${image#*@}"
            test "$(docker run --rm "$ref" cat /target)" = "$target"
          done

  # Both targets for two platforms, arm64 emulated, merged into one index per
  # target. The second destination of app receives only the index.
  platforms:
    runs-on: ubuntu-26.04
    services:
      registry:
        image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7.0.1
      - id: bake
        uses: ./bake
        with:
          bakefile: tests/bake/kaniko-bake.hcl
          targets: app tools
          context: tests/bake
          platforms: linux/amd64,linux/arm64
          set: |
            app.destination=${{ env.REGISTRY }}/test-bake-platforms-app:${{ github.sha }}
            app.destination=${{ env.REGISTRY }}/test-bake-platforms-app-copy:${{ github.sha }}
            tools.destination=${{ env.REGISTRY }}/test-bake-platforms-tools
      - name: verify
        env:
          IMAGES: ${{ steps.bake.outputs.images }}
          MERGE_IMAGE: registry.gitlab.com/osscontainertools/components/kaniko/merge:release-11b74ff77aae51e40166744b2c6e062c81633b84@sha256:322a2281f783d403be2b63ce88281f6ee54e9e08644d8f94628b5e23cdf6c4c8
        run: |
          crane() {
            docker run --rm --network host "$MERGE_IMAGE" crane "$@"
          }
          test "$(echo "$IMAGES" | jq -c 'keys')" = '["app","tools"]'
          for target in app tools; do
            image=$(echo "$IMAGES" | jq -r --arg target "$target" '.[$target]')
            ref="localhost:5000/${image#*/}"
            test "$(crane manifest "$ref" | jq -c '[.manifests[].platform | select(.os != "unknown") | .architecture]')" = '["amd64","arm64"]'
            for platform in linux/amd64 linux/arm64; do
              test "$(docker run --rm --platform "$platform" "$ref" cat /target)" = "$target"
            done
          done
          app=$(echo "$IMAGES" | jq -r .app)
          test "$(crane digest "localhost:5000/test-bake-platforms-app-copy:$GITHUB_SHA")" = "${app#*@}"
          test "$(crane ls localhost:5000/test-bake-platforms-app-copy)" = "$GITHUB_SHA"
          test "$(crane ls localhost:5000/test-bake-platforms-tools | sort | tr '\n' ' ')" = "latest latest-amd64 latest-arm64 "

  # Each target signed with a key and with an SBOM, without the transparency
  # log, as test-sign.yml does for one image.
  sign:
    runs-on: ubuntu-26.04
    services:
      registry:
        image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 5000:5000
    env:
      SIGN_IMAGE: registry.gitlab.com/osscontainertools/components/kaniko/sign:release-018d8426701f196bd5dac1f2d816ec7a90981044@sha256:f41302b91c8b93674140c4d707cf78b3beb285416d17fa92a274a2a5ed1c9dd9
    steps:
      - uses: actions/checkout@v7.0.1
      - id: key
        env:
          COSIGN_PASSWORD: test
        run: |
          mkdir "$RUNNER_TEMP/keys"
          docker run --rm --user "$(id -u):$(id -g)" --env COSIGN_PASSWORD --volume "$RUNNER_TEMP/keys:/keys" --workdir /keys --entrypoint cosign "$SIGN_IMAGE" generate-key-pair
          {
            echo "key<<EOF"
            cat "$RUNNER_TEMP/keys/cosign.key"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - id: bake
        uses: ./bake
        env:
          COSIGN_PRIVATE_KEY: ${{ steps.key.outputs.key }}
          COSIGN_PASSWORD: test
        with:
          bakefile: tests/bake/kaniko-bake.hcl
          targets: app tools
          context: tests/bake
          set: |
            app.destination=${{ env.REGISTRY }}/test-bake-sign-app:${{ github.sha }}
            tools.destination=${{ env.REGISTRY }}/test-bake-sign-tools:${{ github.sha }}
          cosign: key
          tlog: false
          sbom: true
      - name: verify
        env:
          IMAGES: ${{ steps.bake.outputs.images }}
        run: |
          cosign() {
            docker run --rm --network host --volume "$RUNNER_TEMP/keys:/keys:ro" --entrypoint cosign "$SIGN_IMAGE" "$@" \
              --key /keys/cosign.pub --insecure-ignore-tlog
          }
          for image in $(echo "$IMAGES" | jq -r '.[]'); do
            ref="localhost:5000/${image#*/}"
            cosign verify "$ref" > /dev/null
            digest=$(docker run --rm --network host --entrypoint crane "$SIGN_IMAGE" manifest "$ref" | jq -r '.manifests[] | select(.platform.os != "unknown") | .digest')
            cosign verify-attestation --type spdxjson "${ref%@*}@$digest" > /dev/null
          done
