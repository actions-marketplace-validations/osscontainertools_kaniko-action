# A job inside the kaniko image, as on a Kubernetes runner without Docker. The
# action runs kaniko directly. JavaScript actions such as actions/checkout do
# not run in this image, so without a checkout kaniko clones the commit itself.
name: test-container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    container: ghcr.io/osscontainertools/kaniko:v1.29.2-debug@sha256:b3cadc638a5b0a7e8ae7b3b76704821b2b5f191163222da401283541c8fa2d41
    services:
      registry:
        image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    steps:
      # A user writes `uses: osscontainertools/kaniko-action@ceb92e98221fffab4125600c76fffa6eda8ac17d # v1.1.0`. This test
      # fetches the action at the commit under test instead.
      - name: fetch the action
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir .action
          wget -q -O - --header "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" | tar -xz -C .action --strip-components 1
      - id: build
        uses: ./.action
        with:
          context: tests/build
          destination: registry:5000/test-container:${{ github.sha }}
          target: base
          build-args: |
            GREETING=hello ${{ github.run_id }}
          extra-args: --insecure-registry=registry:5000
      - name: verify
        shell: sh
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: echo "$IMAGE" | grep -E "^registry:5000/test-container@sha256:[0-9a-f]{64}$"
