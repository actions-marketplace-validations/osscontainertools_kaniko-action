# A job inside the kaniko image, as on a Kubernetes runner without Docker. The
# action runs kaniko directly. JavaScript actions such as actions/checkout do
# not run in this image, so without a checkout kaniko clones the commit itself.
name: test-container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-26.04
    container: ghcr.io/osscontainertools/kaniko:v1.29.1-debug@sha256:ebc38a988e5aa1aaea99240e931aeeeff9d8e6bb5a0bd0e00eaf79973bf0a773
    steps:
      # A user writes `uses: osscontainertools/kaniko-action@58c7a9b907d8c089ff81c5335d129107d57f8e25 # v1.0.0`. This test
      # fetches the action at the commit under test instead.
      - name: fetch the action
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir .action
          wget -q -O - --header "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" | tar -xz -C .action --strip-components 1
      - id: build
        uses: ./.action
        with:
          context: tests/build
          destination: ghcr.io/${{ github.repository }}/test-container:${{ github.sha }}
          target: base
          build-args: |
            GREETING=hello ${{ github.run_id }}
      - name: verify
        shell: sh
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: echo "$IMAGE" | grep -E "^ghcr.io/${GITHUB_REPOSITORY}/test-container@sha256:[0-9a-f]{64}$"
